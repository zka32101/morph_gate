name: morph_gate
description: "Morph Gate - Fantasy jelly morphing hypercasual game"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Game engine
  flame: ^1.24.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP / AI API
  http: ^1.2.1
  flutter_dotenv: ^5.2.1

  # UI
  google_fonts: ^6.2.1

  # Utils
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  uuid: ^4.4.2

  # Audio
  flame_audio: ^2.1.2

  # Ads
  google_mobile_ads: ^5.3.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_analytics: ^10.7.0
  firebase_realtime_database: ^10.2.0

  # In-App Purchases
  purchases_flutter: ^7.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - .env
